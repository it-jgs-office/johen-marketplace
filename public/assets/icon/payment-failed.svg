<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <style>
    .failed-mark{transform-origin:48px 48px;animation:failed-pop 2.4s cubic-bezier(.2,.85,.3,1) infinite}
    .failed-halo{transform-origin:48px 48px;animation:failed-halo 2.4s ease-out infinite}
    .failed-ring{stroke-dasharray:220;stroke-dashoffset:220;animation:failed-draw-ring 2.4s ease-in-out infinite}
    .failed-cross-a,.failed-cross-b{stroke-dasharray:46;stroke-dashoffset:46}
    .failed-cross-a{animation:failed-draw-cross-a 2.4s ease-in-out infinite}
    .failed-cross-b{animation:failed-draw-cross-b 2.4s ease-in-out infinite}
    .failed-spark{transform-box:fill-box;transform-origin:center;animation:failed-spark 2.4s ease-out infinite}
    .failed-spark-b{animation-delay:.08s}
    @keyframes failed-pop{0%,8%{transform:scale(.76);opacity:0}20%,78%{transform:scale(1);opacity:1}86%{transform:scale(.96)}100%{transform:scale(.78);opacity:0}}
    @keyframes failed-halo{0%,12%{transform:scale(.55);opacity:0}26%{opacity:.28}62%{transform:scale(1.12);opacity:0}100%{opacity:0}}
    @keyframes failed-draw-ring{0%,10%{stroke-dashoffset:220}34%,78%{stroke-dashoffset:0}100%{stroke-dashoffset:-220}}
    @keyframes failed-draw-cross-a{0%,28%{stroke-dashoffset:46}46%,82%{stroke-dashoffset:0}100%{stroke-dashoffset:-46}}
    @keyframes failed-draw-cross-b{0%,36%{stroke-dashoffset:46}54%,82%{stroke-dashoffset:0}100%{stroke-dashoffset:-46}}
    @keyframes failed-spark{0%,38%{transform:scale(0);opacity:0}52%{transform:scale(1);opacity:1}70%,100%{transform:scale(.25);opacity:0}}
    @media(prefers-reduced-motion:reduce){.failed-mark,.failed-halo,.failed-ring,.failed-cross-a,.failed-cross-b,.failed-spark{animation:none}.failed-ring,.failed-cross-a,.failed-cross-b{stroke-dashoffset:0}.failed-mark{opacity:1}.failed-halo,.failed-spark{display:none}}
  </style>
  <circle class="failed-halo" cx="48" cy="48" r="40" fill="#ef4444" opacity="0"/>
  <g class="failed-mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="48" cy="48" r="34" fill="#fff5f5" stroke="#fecaca" stroke-width="2"/>
    <circle class="failed-ring" cx="48" cy="48" r="34" stroke="#ef4444" stroke-width="4" transform="rotate(-90 48 48)"/>
    <path class="failed-cross-a" d="M35 35l26 26" stroke="#ef4444" stroke-width="6"/>
    <path class="failed-cross-b" d="M61 35L35 61" stroke="#ef4444" stroke-width="6"/>
  </g>
  <circle class="failed-spark" cx="79" cy="26" r="3" fill="#fb7185"/>
  <circle class="failed-spark failed-spark-b" cx="18" cy="66" r="2.5" fill="#fca5a5"/>
</svg>
